[tool.ruff]
# 기존 코드가 100~115자 사이에 몰려 있어 120 으로 맞춘다.
line-length = 120
target-version = "py312"
src = ["ai"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff 고유 규칙
]
ignore = [
    "E501",  # 줄 길이는 포매터가 관리한다
    "B008",  # FastAPI 의 Depends/File 기본값 패턴
]

[tool.ruff.lint.per-file-ignores]
"ai/tests/*" = ["SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["ai/tests"]
pythonpath = ["ai"]
