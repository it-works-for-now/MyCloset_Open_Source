# 클론 직후 바로 `./gradlew build` 가 통과하도록, 통합 테스트는 인메모리 H2 를 쓴다.
# 운영 DB 접속 정보 없이도 컨텍스트가 뜨는지 확인하는 것이 목적이다.
spring:
  datasource:
    url: jdbc:h2:mem:mycloset;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    # 테스트 전용 값이다. 운영에서는 환경변수 JWT_SECRET 을 쓴다.
    secret: test-only-jwt-secret-do-not-use-in-production-1234567890
