services:
  ai:
    build: .
    env_file:
      - .env
    ports:
      - "${AI_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    volumes:
      - model-cache:/app/.model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  model-cache:
